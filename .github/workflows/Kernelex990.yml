name: Build KernelSU Next
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm

      - name: Setup KernelSU Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
          echo "CONFIG_KSU=y" >> arch/arm64/configs/exynos990-hubble_eur_open_defconfig
          echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/exynos990-hubble_eur_open_defconfig
          echo "CONFIG_KSU_NEXT=y" >> arch/arm64/configs/exynos990-hubble_eur_open_defconfig

      - name: Build Kernel
        run: |
          make O=out ARCH=arm64 exynos990-hubble_eur_open_defconfig
          make -j$(nproc) O=out ARCH=arm64 \
          CC=clang \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          LLVM=1 \
          Image.gz

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_S20_Ultra_KSU
          path: out/arch/arm64/boot/Image.gz
