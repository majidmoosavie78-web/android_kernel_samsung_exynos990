name: Build Original ExtremeXT Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Fix Missing KernelSU
        run: |
          mkdir -p drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

      - name: Build Kernel
        run: |
          make O=out ARCH=arm64 exynos990-hubble_eur_open_defconfig
          make -j$(nproc) O=out ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          LLVM=1 \
          Image.gz

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: S20_Ultra_ExtremeXT_Kernel
          path: out/arch/arm64/boot/Image.gz
